version: 2

models:
  - name: bronze_pos_orders
    description: >
      Typed pass-through of raw POS order lines. Casts raw strings to contracted
      types; performs no dedup/conform/business logic. Still carries the injected
      duplicates, null customer ids, dirty region spellings and returns — all
      resolved in Silver. Grain: one row per landed order line (incl. duplicates).
    columns:
      - name: order_line_id
        description: POS order-line natural key. Not unique here (duplicates present until Silver).
      - name: order_id
        description: Parent order identifier.
      - name: order_date
        description: Transaction date (DATE).
      - name: customer_id
        description: Customer natural key; nullable (missingness injected).
      - name: product_id
        description: Product natural key.
      - name: region
        description: Raw region label; inconsistent spelling, conformed in Silver.
      - name: channel
        description: Sales channel (Retail/Online/Wholesale).
      - name: quantity
        description: Units (INT64); negative on returns.
      - name: unit_price
        description: Per-unit list price in line currency (NUMERIC).
      - name: discount_pct
        description: Fractional discount 0–1 (FLOAT64).
      - name: gross_revenue
        description: quantity * unit_price in line currency (NUMERIC).
      - name: discount_amount
        description: Discount value in line currency; negative on returns (NUMERIC).
      - name: net_revenue
        description: gross_revenue - discount_amount in line currency (NUMERIC).
      - name: currency
        description: ISO currency of monetary columns (USD/EUR).
      - name: _loaded_at
        description: Ingestion timestamp, UTC (TIMESTAMP).
      - name: _source_file
        description: Originating file name.
      - name: _batch_id
        description: SHA-256 content hash of the source file (idempotency key).
      - name: _source_system
        description: Source system tag.

  - name: bronze_gl
    description: >
      Typed pass-through of raw ERP general-ledger postings. Grain: one row per
      GL posting. Revenue (4000) and COGS (5000) reconcile to the sales facts.
    columns:
      - name: gl_id
        description: Unique GL posting id.
      - name: posting_date
        description: Posting date (DATE).
      - name: account_code
        description: GL account code (4000 revenue, 5000 COGS, 6xxx opex).
      - name: account_name
        description: Human-readable account name.
      - name: region
        description: Attributed region.
      - name: cost_center
        description: Cost center / channel.
      - name: amount_usd
        description: Amount in USD; revenue negative (credit), expenses positive (debit) (NUMERIC).
      - name: currency
        description: Always USD for the GL.
      - name: source_system
        description: Source system tag carried on the extract.
      - name: _loaded_at
        description: Ingestion timestamp, UTC (TIMESTAMP).
      - name: _source_file
        description: Originating file name.
      - name: _batch_id
        description: SHA-256 content hash of the source file.
      - name: _source_system
        description: Source system tag stamped at ingestion.

  - name: bronze_customer_master
    description: >
      Typed pass-through of raw dated customer-master extracts. Grain: one row per
      customer per extract_date. Feeds dim_customer (SCD Type 2).
    columns:
      - name: extract_date
        description: Date the full extract was taken (part of the natural key) (DATE).
      - name: customer_id
        description: Customer natural key.
      - name: customer_name
        description: Customer display name.
      - name: customer_segment
        description: Commercial segment; SCD2-tracked in Gold.
      - name: region
        description: Home region; SCD2-tracked in Gold.
      - name: signup_date
        description: Onboarding date (DATE); may predate the reporting window.
      - name: _loaded_at
        description: Ingestion timestamp, UTC (TIMESTAMP).
      - name: _source_file
        description: Originating file name.
      - name: _batch_id
        description: SHA-256 content hash of the source file.
      - name: _source_system
        description: Source system tag.

  - name: bronze_product_master
    description: >
      Typed pass-through of raw dated product-master extracts. Grain: one row per
      product per extract_date. Feeds dim_product (SCD1 on description, SCD2 on
      category and list_price).
    columns:
      - name: extract_date
        description: Date the full extract was taken (part of the natural key) (DATE).
      - name: product_id
        description: Product natural key.
      - name: description
        description: Product description; SCD1-tracked in Gold.
      - name: category
        description: Merchandising category; SCD2-tracked in Gold.
      - name: subcategory
        description: Merchandising subcategory.
      - name: list_price
        description: Catalogue list price in USD; SCD2-tracked (NUMERIC).
      - name: standard_cost
        description: Standard unit cost in USD (NUMERIC).
      - name: _loaded_at
        description: Ingestion timestamp, UTC (TIMESTAMP).
      - name: _source_file
        description: Originating file name.
      - name: _batch_id
        description: SHA-256 content hash of the source file.
      - name: _source_system
        description: Source system tag.

  - name: bronze_fx_rates
    description: >
      Typed pass-through of raw monthly FX rates. Grain: one row per month per
      currency pair. Used in Silver to convert non-USD sales to USD.
    columns:
      - name: rate_date
        description: First day of the month the rate applies to (DATE).
      - name: from_currency
        description: Source currency of the pair.
      - name: to_currency
        description: Target (reporting) currency, always USD.
      - name: rate
        description: Multiplicative conversion rate from->to (NUMERIC).
      - name: _loaded_at
        description: Ingestion timestamp, UTC (TIMESTAMP).
      - name: _source_file
        description: Originating file name.
      - name: _batch_id
        description: SHA-256 content hash of the source file.
      - name: _source_system
        description: Source system tag.
