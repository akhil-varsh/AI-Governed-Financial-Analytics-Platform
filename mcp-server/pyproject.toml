[project]
name = "cfo-mcp"
version = "0.1.0"
description = "Governed, read-only MCP server over a finance data warehouse — safe natural-language access for CFO / deal-team users."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Akhil Varsh Pettem" }]

dependencies = [
    # Official Anthropic MCP Python SDK (bundles mcp.server.fastmcp.FastMCP).
    "mcp>=1.27,<2",
    "duckdb>=1.1",
    "sqlglot>=25,<28",          # parse raw SQL to an AST for the identifier/schema guard
    "pydantic>=2.7,<3",
    "structlog>=24.1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cfo-mcp = "cfo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
